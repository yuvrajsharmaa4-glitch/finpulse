<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPulse — Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090F;--s1:#0D1117;--s2:#161B22;--s3:#1C2333;
  --b1:#21262D;--b2:#30363D;--b3:#484F58;
  --tx:#E6EDF3;--t2:#8B949E;--t3:#6E7681;
  --up:#26A69A;--dn:#EF5350;--gold:#D29922;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px;line-height:1.5;overflow-x:hidden;height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:var(--sans);border:none;outline:none}
input{font-family:var(--mono);outline:none}
.ticker{height:26px;background:var(--s1);border-bottom:1px solid var(--b1);overflow:hidden;display:flex;align-items:center;flex-shrink:0}
.t-track{display:flex;animation:tick 50s linear infinite;white-space:nowrap}
.t-track:hover{animation-play-state:paused}
.t-item{display:flex;gap:6px;padding:0 18px;border-right:1px solid var(--b1);font-family:var(--mono);font-size:10px;align-items:center;height:26px}
.t-sym{font-weight:700;color:var(--tx)}.t-p{color:var(--t2)}
.t-c.u{color:var(--up)}.t-c.d{color:var(--dn)}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.nav{background:var(--s1);border-bottom:1px solid var(--b1);padding:0 14px;display:flex;align-items:center;gap:12px;height:48px;flex-shrink:0}
.logo{font-weight:800;font-size:14px;letter-spacing:2px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.logo-bar{width:3px;height:18px;background:var(--gold);border-radius:2px}
.logo span{color:var(--gold)}
.search-box{flex:1;max-width:400px;position:relative}
.s-in{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:5px;padding:6px 52px 6px 28px;color:var(--tx);font-size:12px;transition:border-color .15s}
.s-in:focus{border-color:var(--gold)}
.s-in::placeholder{color:var(--t3)}
.s-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;pointer-events:none}
.s-btn{position:absolute;right:0;top:0;height:100%;padding:0 12px;background:var(--gold);color:#000;border-radius:0 5px 5px 0;font-weight:700;font-size:10px}
.s-btn:hover{background:#B8830F}
.nav-indices{display:flex;gap:14px;margin-left:auto}
.ni-n{font-size:9px;color:var(--t3);letter-spacing:.6px;text-transform:uppercase}
.ni-v{font-family:var(--mono);font-size:11px;font-weight:600}
.ni-v.u{color:var(--up)}.ni-v.d{color:var(--dn)}
.main-wrap{display:flex;flex:1;overflow:hidden}
.left-col{width:215px;flex-shrink:0;border-right:1px solid var(--b1);overflow-y:auto;background:var(--s1)}
.left-col::-webkit-scrollbar{width:3px}
.left-col::-webkit-scrollbar-thumb{background:var(--b2)}
.center-col{flex:1;overflow-y:auto;min-width:0}
.center-col::-webkit-scrollbar{width:4px}
.center-col::-webkit-scrollbar-thumb{background:var(--b2)}
.news-col{width:275px;flex-shrink:0;border-left:1px solid var(--b1);background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
.lc-head{padding:9px 12px;background:var(--s2);border-bottom:1px solid var(--b1);border-top:1px solid var(--b1);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.lc-head:first-child{border-top:none}
.mkt-row{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
.mkt-row:hover{background:var(--s2)}
.mr-name{font-size:11px;color:var(--t2)}
.mr-right{text-align:right}
.mr-p{font-family:var(--mono);font-size:11px;font-weight:600}
.mr-c{font-family:var(--mono);font-size:10px}
.mr-c.u{color:var(--up)}.mr-c.d{color:var(--dn)}
.mv-tab-row{display:flex;border-bottom:1px solid var(--b1)}
.mv-t{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);padding:7px;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;transition:all .12s;margin-bottom:-1px}
.mv-t.on{color:var(--gold);border-bottom-color:var(--gold)}
.mv-item{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
.mv-item:hover{background:var(--s2)}
.mv-sym{font-family:var(--mono);font-weight:700;font-size:11px}
.mv-co{font-size:9px;color:var(--t3)}
.mv-chg{font-family:var(--mono);font-size:10px;font-weight:600}
.mv-chg.u{color:var(--up)}.mv-chg.d{color:var(--dn)}
.nc-head{padding:10px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--s2)}
.nc-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2)}
.nc-live{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--up);font-weight:600}
.live-dot{width:6px;height:6px;background:var(--up);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nc-filters{display:flex;border-bottom:1px solid var(--b1);background:var(--s1);overflow-x:auto;flex-shrink:0}
.nc-filters::-webkit-scrollbar{display:none}
.nf-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);padding:6px 10px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;transition:all .12s;margin-bottom:-1px;flex-shrink:0}
.nf-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.nf-btn:hover:not(.on){color:var(--tx)}
.nc-body{flex:1;overflow-y:auto}
.nc-body::-webkit-scrollbar{width:3px}
.nc-body::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.n-item{padding:12px 14px;border-bottom:1px solid var(--b1);transition:background .1s}
.n-item:hover{background:var(--s2)}
.n-item:last-child{border-bottom:none}
.n-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.n-src{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}
.n-time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.n-tag{font-size:8px;padding:1px 6px;border-radius:2px;margin-right:4px;font-weight:700;letter-spacing:.3px}
.n-tag.Markets{background:#0F1A20;border:1px solid #1A3040;color:#5BB8D4}
.n-tag.Stocks{background:#0F1A0F;border:1px solid #1A3A1A;color:#6FCF6F}
.n-tag.Economy{background:#1A1800;border:1px solid #3A3000;color:#D4B856}
.n-tag.Crypto{background:#1A0F1A;border:1px solid #3A1A3A;color:#C47FD4}
.n-tag.Earnings{background:#1A0F0F;border:1px solid #3A1A1A;color:#D47F7F}
.n-tag.Global{background:#0F0F1A;border:1px solid #1A1A3A;color:#7F9FD4}
.n-tag.Commodities{background:#1A1500;border:1px solid #3A2A00;color:#D4A856}
.n-title{font-weight:700;font-size:11px;line-height:1.4;color:var(--tx);margin-bottom:3px}
.n-sum{font-size:10px;color:var(--t2);line-height:1.5}
.nc-footer{padding:9px 12px;border-top:1px solid var(--b1);flex-shrink:0}
.nc-refresh{width:100%;background:var(--s2);border:1px solid var(--b1);color:var(--t2);padding:6px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:all .12s}
.nc-refresh:hover{border-color:var(--gold);color:var(--gold)}
.skel{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:sh 1.3s infinite;border-radius:3px;height:10px;margin-bottom:6px}
@keyframes sh{0%{background-position:200%}100%{background-position:-200%}}
.home-wrap{padding:14px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2)}
.sec-line{flex:1;height:1px;background:var(--b1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{background:var(--s2);border:1px solid var(--b1);color:var(--gold);padding:5px 11px;border-radius:4px;font-weight:700;font-size:11px;font-family:var(--mono);letter-spacing:.4px;transition:all .12s}
.chip:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--b1);border-radius:8px;overflow:hidden;border:1px solid var(--b1);margin-bottom:14px}
.feat-item{background:var(--s1);padding:16px;cursor:pointer;transition:background .12s}
.feat-item:hover{background:var(--s2);cursor:pointer}
.feat-item.big{grid-column:1/-1;border-bottom:1px solid var(--b1);padding:20px}
.feat-tag{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.5px;display:inline-block;margin-bottom:8px}
.feat-tag.Economy{background:#1A1800;border:1px solid #3A3000;color:#D4B856}
.feat-tag.Markets{background:#0F1A20;border:1px solid #1A3040;color:#5BB8D4}
.feat-tag.Global{background:#0F0F1A;border:1px solid #1A1A3A;color:#7F9FD4}
.feat-tag.Stocks{background:#0F1A0F;border:1px solid #1A3A1A;color:#6FCF6F}
.feat-tag.Crypto{background:#1A0F1A;border:1px solid #3A1A3A;color:#C47FD4}
.feat-tag.Commodities{background:#1A1500;border:1px solid #3A2A00;color:#D4A856}
.feat-title{font-weight:800;font-size:14px;line-height:1.4;color:var(--tx);margin-bottom:6px}
.feat-item.big .feat-title{font-size:17px;line-height:1.35}
.feat-sum{font-size:11px;color:var(--t2);line-height:1.6}
.feat-item.big .feat-sum{font-size:12px}
.feat-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.feat-src{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.5px;text-transform:uppercase}
.feat-time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.more-news{display:flex;flex-direction:column;gap:1px;background:var(--b1);border-radius:8px;overflow:hidden;border:1px solid var(--b1)}
.more-item{background:var(--s1);padding:12px 16px;cursor:pointer;transition:background .12s;display:flex;gap:12px;align-items:flex-start}
.more-item:hover{background:var(--s2)}
.more-num{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--b3);min-width:24px;line-height:1.2;margin-top:2px}
.more-title{font-weight:700;font-size:12px;line-height:1.4;margin-bottom:3px}
.more-meta{display:flex;gap:8px;align-items:center}
.more-src{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.4px}
.more-time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.more-tag{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:700}
.more-tag.Economy{background:#1A1800;border:1px solid #3A3000;color:#D4B856}
.more-tag.Markets{background:#0F1A20;border:1px solid #1A3040;color:#5BB8D4}
.more-tag.Global{background:#0F0F1A;border:1px solid #1A1A3A;color:#7F9FD4}
.more-tag.Stocks{background:#0F1A0F;border:1px solid #1A3A1A;color:#6FCF6F}
.more-tag.Crypto{background:#1A0F1A;border:1px solid #3A1A3A;color:#C47FD4}
.more-tag.Commodities{background:#1A1500;border:1px solid #3A2A00;color:#D4A856}
.stock-wrap{padding:14px}
.spin-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;gap:10px}
.spin{width:26px;height:26px;border:2px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{color:var(--t3);font-size:11px}
.err{background:#170808;border:1px solid #4A1010;border-radius:6px;padding:10px 14px;color:#E07070;font-size:11px;margin-bottom:12px}
.back-btn{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--b1);color:var(--t2);padding:4px 11px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:12px;transition:all .12s}
.back-btn:hover{color:var(--gold);border-color:var(--gold)}
.stk-hdr{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.stk-sym{font-family:var(--mono);font-size:22px;font-weight:700}
.stk-name{color:var(--t2);font-size:11px;margin-top:2px}
.stk-badges{display:flex;gap:5px;margin-top:5px}
.bdg{background:var(--s2);border:1px solid var(--b1);color:var(--t3);font-size:9px;padding:1px 6px;border-radius:3px}
.bdg.sec{color:#7B9CDD;border-color:#2A3550;background:#0F1A2E}
.stk-price{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1;text-align:right}
.stk-chg{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;margin-top:3px}
.stk-chg.u{color:var(--up)}.stk-chg.d{color:var(--dn)}
.tab-bar{display:flex;background:var(--s1);border:1px solid var(--b1);border-radius:8px 8px 0 0;overflow:hidden}
.t-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;transition:all .12s;margin-bottom:-1px}
.t-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.t-btn:hover:not(.on){color:var(--tx)}
.tab-content{background:var(--s1);border:1px solid var(--b1);border-top:none;border-radius:0 0 8px 8px;padding:14px;margin-bottom:12px}
.chart-controls{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rng-btns{display:flex;gap:3px}
.rng-btn{background:transparent;border:1px solid var(--b1);color:var(--t3);padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);transition:all .12s}
.rng-btn.on{background:var(--gold);border-color:var(--gold);color:#000}
.rng-btn:hover:not(.on){border-color:var(--b3);color:var(--tx)}
.divider-v{width:1px;height:20px;background:var(--b1)}
.chart-type-btns{display:flex;gap:2px;background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:2px}
.ct-btn{background:transparent;border:none;color:var(--t3);padding:3px 10px;border-radius:3px;font-size:10px;font-weight:700;transition:all .12s}
.ct-btn.on{background:var(--b2);color:var(--tx)}
.chart-area{position:relative;height:210px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:1px;background:var(--b1);border-radius:6px;overflow:hidden;border:1px solid var(--b1);margin-top:12px}
.sc{background:var(--s2);padding:9px 11px}
.sc-l{font-size:9px;color:var(--t3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.sc-v{font-family:var(--mono);font-size:12px;font-weight:600}
.stock-news-list{display:flex;flex-direction:column;gap:1px;background:var(--b1);border-radius:6px;overflow:hidden;border:1px solid var(--b1)}
.sn{padding:12px;background:var(--s2);border-bottom:1px solid var(--b1)}
.sn:last-child{border-bottom:none}
.sn-src{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase}
.sn-time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.sn-title{font-weight:700;font-size:12px;line-height:1.4;margin:4px 0}
.sn-sum{font-size:10px;color:var(--t2);line-height:1.5}
.about-card{background:var(--s2);border-radius:6px;border:1px solid var(--b1);padding:14px}
.about-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.about-txt{color:var(--t2);font-size:12px;line-height:1.7}
.about-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:12px}
.ac{background:var(--s1);border:1px solid var(--b1);border-radius:5px;padding:9px 11px}
.ac-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.ac-v{font-weight:700;font-size:11px}
.c-tip{position:absolute;background:var(--s2);border:1px solid var(--b2);padding:7px 10px;border-radius:4px;pointer-events:none;display:none;z-index:10;font-family:var(--mono);min-width:120px}
.c-tip-p{font-size:12px;font-weight:700;margin-bottom:3px}
.c-tip-row{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--t2);margin-bottom:2px}
.c-tip-row span:last-child{color:var(--tx)}
@media(max-width:900px){.left-col{display:none}}
@media(max-width:650px){.news-col{display:none}.nav-indices{display:none}}
</style>
</head>
<body>

<div class="ticker"><div class="t-track" id="tTrack"></div></div>

<div class="nav">
  <div class="logo"><div class="logo-bar"></div>FIN<span>PULSE</span></div>
  <div class="search-box">
    <span class="s-ico">&#x2315;</span>
    <input class="s-in" id="sIn" placeholder="Search &#x2014; AAPL, TSLA, BTC-USD&#x2026;"/>
    <button class="s-btn" onclick="doSearch()">GO</button>
  </div>
  <div class="nav-indices">
    <div style="text-align:right"><div class="ni-n">S&amp;P 500</div><div class="ni-v u" id="sp500">&#x25B2; 5,667</div></div>
    <div style="text-align:right"><div class="ni-n">NASDAQ</div><div class="ni-v u" id="nasdaq">&#x25B2; 17,754</div></div>
    <div style="text-align:right"><div class="ni-n">DOW</div><div class="ni-v d" id="dow">&#x25BC; 41,985</div></div>
  </div>
</div>

<div class="main-wrap">
  <div class="left-col">
    <div class="lc-head">Markets</div>
    <div id="mktRows"></div>
    <div class="lc-head">Top Movers</div>
    <div class="mv-tab-row">
      <button class="mv-t on" onclick="showMv('g',this)">Gainers</button>
      <button class="mv-t" onclick="showMv('l',this)">Losers</button>
    </div>
    <div id="mv-g"></div>
    <div id="mv-l" style="display:none"></div>
  </div>

  <div class="center-col">
    <!-- HOME: featured news fills the center -->
    <div id="homeView" class="home-wrap">
      <div class="sec-head"><span class="sec-lbl">Quick Search</span><div class="sec-line"></div></div>
      <div class="chips" id="chipRow"></div>
      <div class="sec-head"><span class="sec-lbl">Top Stories</span><div class="sec-line"></div></div>
      <div id="featuredNews">
        <div class="featured-grid">
          <div class="feat-item big"><div class="skel" style="width:15%;margin-bottom:10px"></div><div class="skel" style="width:80%;height:14px;margin-bottom:8px"></div><div class="skel" style="width:95%;height:14px;margin-bottom:8px"></div><div class="skel" style="width:100%;margin-bottom:6px"></div><div class="skel" style="width:90%"></div></div>
          <div class="feat-item"><div class="skel" style="width:20%;margin-bottom:8px"></div><div class="skel" style="width:90%;height:12px;margin-bottom:6px"></div><div class="skel" style="width:100%;margin-bottom:5px"></div><div class="skel" style="width:80%"></div></div>
          <div class="feat-item"><div class="skel" style="width:20%;margin-bottom:8px"></div><div class="skel" style="width:90%;height:12px;margin-bottom:6px"></div><div class="skel" style="width:100%;margin-bottom:5px"></div><div class="skel" style="width:80%"></div></div>
        </div>
        <div class="sec-head" style="margin-top:14px"><span class="sec-lbl">More Stories</span><div class="sec-line"></div></div>
        <div class="more-news" id="moreNews"></div>
      </div>
    </div>
    <div id="loadBox" style="display:none"><div class="spin-box"><div class="spin"></div><div class="spin-txt">Fetching live data&#x2026;</div></div></div>
    <div id="errBox" style="display:none;margin:14px" class="err"></div>
    <div id="stkView" style="display:none" class="stock-wrap"></div>
  </div>

// Chart functions
function genOHLC(price,range){
  const bars=[];const count=range==='1D'?26:range==='5D'?25:range==='1M'?30:range==='3M'?66:252;
  const vol=range==='1D'?0.003:range==='5D'?0.007:range==='1M'?0.012:range==='3M'?0.013:0.015;
  let c=price*(range==='1Y'?.65+Math.random()*.2:range==='3M'?.82+Math.random()*.1:.88+Math.random()*.08);
  const now=new Date();
  for(let i=count;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    if(range!=='1D'&&(d.getDay()===0||d.getDay()===6))continue;
    const chg=(Math.random()-.47)*vol,o=c;c=o*(1+chg);
    const h=Math.max(o,c)*(1+Math.random()*vol*.8),l=Math.min(o,c)*(1-Math.random()*vol*.8);
    let lbl=range==='1D'?`${9+Math.floor(((i*15)+30)/60)}:${((i*15+30)%60).toString().padStart(2,'0')}`:d.toLocaleDateString('en-US',{month:'short',day:'numeric',...(range==='1Y'&&{year:'2-digit'})});
    bars.push({t:lbl,o:+o.toFixed(2),h:+h.toFixed(2),l:+l.toFixed(2),c:+c.toFixed(2)});
  }
  if(bars.length){bars[bars.length-1].c=price;bars[bars.length-1].h=Math.max(bars[bars.length-1].o,price,bars[bars.length-1].h);bars[bars.length-1].l=Math.min(bars[bars.length-1].o,price,bars[bars.length-1].l)}
  return bars;
}
function drawLine(data,color,id){
  const c=document.getElementById(id);if(!c||!data.length)return;
  const W=c.clientWidth||460,H=210,pL=46,pR=6,pT=8,pB=22,cw=W-pL-pR,ch=H-pT-pB;
  const prices=data.map(d=>d.c),mn=Math.min(...prices),mx=Math.max(...prices);
  const pad=(mx-mn)*.1||mx*.04,lo=mn-pad,hi=mx+pad;
  const xS=i=>pL+(i/(data.length-1))*cw,yS=v=>pT+(1-(v-lo)/(hi-lo))*ch;
  let grid='',xL='',yL='';
  for(let i=0;i<5;i++){const idx=Math.round(i*(data.length-1)/4),x=xS(idx);grid+=`<line x1="${x}" y1="${pT}" x2="${x}" y2="${pT+ch}" stroke="#21262D" stroke-width="1"/>`;xL+=`<text x="${x}" y="${H-2}" fill="#6E7681" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${data[idx].t}</text>`}
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=yS(v);grid+=`<line x1="${pL}" y1="${y}" x2="${pL+cw}" y2="${y}" stroke="#21262D" stroke-width="1"/>`;yL+=`<text x="${pL-3}" y="${y+3}" fill="#6E7681" font-size="9" text-anchor="end" font-family="JetBrains Mono">$${v.toFixed(0)}</text>`}
  const pts=data.map((d,i)=>`${i===0?'M':'L'}${xS(i).toFixed(1)},${yS(d.c).toFixed(1)}`).join(' ');
  const fp=pts+` L${xS(data.length-1).toFixed(1)},${(pT+ch).toFixed(1)} L${pL},${(pT+ch).toFixed(1)} Z`;
  const gid='g'+Math.random().toString(36).substr(2,5);
  c.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".18"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient><clipPath id="cp${gid}"><rect x="${pL}" y="${pT}" width="${cw}" height="${ch}"/></clipPath></defs>${grid}${yL}${xL}<g clip-path="url(#cp${gid})"><path d="${fp}" fill="url(#${gid})"/><path d="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/></g><rect id="hr${gid}" x="${pL}" y="${pT}" width="${cw}" height="${ch}" fill="transparent" style="cursor:crosshair"/></svg><div class="c-tip" id="tip${gid}"><div class="c-tip-p"></div><div class="c-tip-row"><span>Close</span><span id="tc${gid}"></span></div></div>`;
  const hr=c.querySelector(`#hr${gid}`),tip=c.querySelector(`#tip${gid}`);
  if(hr&&tip){hr.addEventListener('mousemove',e=>{const r=hr.getBoundingClientRect(),x=e.clientX-r.left,idx=Math.max(0,Math.min(data.length-1,Math.round((x/cw)*(data.length-1))));tip.style.display='block';tip.style.left=Math.min(x+8,cw-130)+'px';tip.style.top='6px';tip.querySelector('.c-tip-p').textContent=data[idx].t;c.querySelector(`#tc${gid}`).textContent='$'+data[idx].c.toFixed(2)});hr.addEventListener('mouseleave',()=>{tip.style.display='none'})}
}
function drawCandles(data,id){
  const c=document.getElementById(id);if(!c||!data.length)return;
  const W=c.clientWidth||460,H=210,pL=46,pR=6,pT=8,pB=22,cw=W-pL-pR,ch=H-pT-pB;
  const mn=Math.min(...data.map(d=>d.l)),mx=Math.max(...data.map(d=>d.h));
  const pad=(mx-mn)*.08||mx*.04,lo=mn-pad,hi=mx+pad;
  const yS=v=>pT+(1-(v-lo)/(hi-lo))*ch;
  const barW=Math.max(2,Math.min(10,Math.floor(cw/data.length)-2));
  const step=cw/(data.length-1||1),tickEvery=Math.max(1,Math.floor(data.length/5));
  let grid='',yL='',xL='',candles='',hovers='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=yS(v);grid+=`<line x1="${pL}" y1="${y}" x2="${pL+cw}" y2="${y}" stroke="#21262D" stroke-width="1"/>`;yL+=`<text x="${pL-3}" y="${y+3}" fill="#6E7681" font-size="9" text-anchor="end" font-family="JetBrains Mono">$${v.toFixed(0)}</text>`}
  data.forEach((d,i)=>{
    const x=pL+i*step,isUp=d.c>=d.o,col=isUp?'#26A69A':'#EF5350';
    const bt=yS(Math.max(d.o,d.c)),bb=yS(Math.min(d.o,d.c)),bh=Math.max(1,bb-bt);
    candles+=`<line x1="${x.toFixed(1)}" y1="${yS(d.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${bt.toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    candles+=`<rect x="${(x-barW/2).toFixed(1)}" y="${bt.toFixed(1)}" width="${barW}" height="${bh.toFixed(1)}" fill="${col}" stroke="${col}" stroke-width="0.5"/>`;
    candles+=`<line x1="${x.toFixed(1)}" y1="${bb.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yS(d.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;
    hovers+=`<rect class="ch" data-i="${i}" x="${(x-step/2).toFixed(1)}" y="${pT}" width="${step.toFixed(1)}" height="${ch}" fill="transparent" style="cursor:crosshair"/>`;
    if(i%tickEvery===0)xL+=`<text x="${x.toFixed(1)}" y="${H-2}" fill="#6E7681" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${d.t}</text>`;
  });
  const gid='c'+Math.random().toString(36).substr(2,5);
  c.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}"><clipPath id="cpc${gid}"><rect x="${pL}" y="${pT}" width="${cw}" height="${ch}"/></clipPath>${grid}${yL}${xL}<g clip-path="url(#cpc${gid})">${candles}</g><g clip-path="url(#cpc${gid})">${hovers}</g><line id="xl${gid}" x1="0" y1="0" x2="0" y2="${ch+pT}" stroke="#484F58" stroke-width="1" stroke-dasharray="3 3" style="display:none"/></svg><div class="c-tip" id="tip${gid}"><div class="c-tip-p" style="margin-bottom:3px"></div><div class="c-tip-row"><span>O</span><span id="${gid}o"></span></div><div class="c-tip-row"><span>H</span><span id="${gid}h" style="color:#26A69A"></span></div><div class="c-tip-row"><span>L</span><span id="${gid}l" style="color:#EF5350"></span></div><div class="c-tip-row"><span>C</span><span id="${gid}c"></span></div></div>`;
  const tip=c.querySelector(`#tip${gid}`),xl=c.querySelector(`#xl${gid}`);
  c.querySelectorAll('.ch').forEach(r=>{
    r.addEventListener('mouseenter',()=>{const i=+r.getAttribute('data-i'),d=data[i],x=pL+i*step;tip.style.display='block';tip.style.left=(x-pL>cw/2?x-140:x+10)+'px';tip.style.top='6px';tip.querySelector('.c-tip-p').textContent=d.t;c.querySelector(`#${gid}o`).textContent='$'+d.o.toFixed(2);c.querySelector(`#${gid}h`).textContent='$'+d.h.toFixed(2);c.querySelector(`#${gid}l`).textContent='$'+d.l.toFixed(2);c.querySelector(`#${gid}c`).textContent='$'+d.c.toFixed(2);xl.setAttribute('x1',x.toFixed(1));xl.setAttribute('x2',x.toFixed(1));xl.style.display='block'});
    r.addEventListener('mouseleave',()=>{tip.style.display='none';xl.style.display='none'});
  });
}

          <div class="chart-type-btns">
            <button class="ct-btn ${curType==='line'?'on':''}" onclick="chgType('line',this)">&#x2500; Line</button>
            <button class="ct-btn ${curType==='candle'?'on':''}" onclick="chgType('candle',this)">&#x258E; Candles</button>
          </div>
        </div>
        <div class="chart-area" id="chartArea"></div>
        <div class="stat-grid">${stats.slice(0,6).map(([k,v])=>`<div class="sc"><div class="sc-l">${k}</div><div class="sc-v">${v}</div></div>`).join('')}</div>
      </div>
      <div id="tab-stats" style="display:none"><div class="stat-grid">${stats.map(([k,v])=>`<div class="sc"><div class="sc-l">${k}</div><div class="sc-v">${v}</div></div>`).join('')}</div></div>
      <div id="tab-news" style="display:none"><div class="stock-news-list">${(s.news||[]).map(n=>`<div class="sn"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="sn-src">${n.source||'Reuters'}</span><span class="sn-time">${n.time||''}</span></div><div class="sn-title">${n.title||''}</div><div class="sn-sum">${n.summary||''}</div></div>`).join('')||'<div class="sn"><div class="sn-sum">No stock news available.</div></div>'}</div></div>
      <div id="tab-about" style="display:none"><div class="about-card"><div class="about-lbl">About ${s.name||s.symbol}</div><div class="about-txt">${s.description||'No description available.'}</div><div class="about-grid">${[s.sector&&['Sector',s.sector],s.exchange&&['Exchange',s.exchange],s.marketCap&&['Mkt Cap',s.marketCap],s.beta&&['Beta',s.beta]].filter(Boolean).map(([l,v])=>`<div class="ac"><div class="ac-l">${l}</div><div class="ac-v">${v}</div></div>`).join('')}</div></div></div>
    </div>`;
  sh('stkView',true);setTimeout(drawChart,60);
}
function chgType(t,btn){curType=t;document.querySelectorAll('.ct-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');drawChart()}
function chgRange(r,btn){
  curRange=r;document.querySelectorAll('.rng-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  if(!curStock)return;
  curData=curStock.history&&curStock.history[r]&&curStock.history[r].length?curStock.history[r]:genOHLC(curStock.price,r);
  drawChart();
}
function swTab(n,btn){['chart','stats','news','about'].forEach(t=>{const el=document.getElementById('tab-'+t);if(el)el.style.display=t===n?'block':'none'});document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function goHome(){sh('stkView',false);sh('errBox',false);sh('homeView',true)}
window.addEventListener('resize',drawChart);
</script>
</body>
</html>
